<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-700 text-white min-h-screen">
    <header class="bg-gray-800 p-4 text-center">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-emerald-400">
                Market Tracker
            </h1>
            <p class="text-gray-400 mt-2">
                Track cryptocurrency prices in one place.
            </p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <section class="bg-emerald-900 rounded-xl p-5 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-green-300">
                Search Coins
            </h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="search-input" placeholder="Enter coin name"
                    class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 ">
                <button id="search-btn"
                    class="bg-emerald-500 hover:bg-gray-700 text-slate-900 font-semibold rounded-lg px-6 py-3">
                    Search
                </button>
                <select id="sort-select" class="bg-gray-800 text-white p-2 rounded">
                    <option value="">Sort Coins</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="change-low">24h Change: Low to High</option>
                    <option value="change-high">24h Change: High to Low</option>
                    <option value="market-low">Market Cap: Low to High</option>
                    <option value="market-high">Market Cap: High to Low</option>
                </select>
            </div>
        </section>

        <section class="bg-slate-900 rounded-xl mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <h2 class="text-xl  font-semibold">
                    Top 20 Coins
                </h2>
                <button id="refresh-btn" class="border border-yellow-700 hover:bg-emerald-800 rounded-lg px-4 py-2">
                    Refresh Prices
                </button>
            </div>
            <div id="coin-data" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-5">
            </div>
        </section>
        <section class="mt-10">
            <h2 class="text-2xl font-bold text-white mb-4">
                Coin Details
            </h2>

            <div id="coin-details" class="bg-gray-800 p-5 rounded-xl">
                Select a coin to see details.
            </div>
        </section>
        <section class="bg-slate-900 rounded-xl p-5 mb-8 border border-gray-600">
            <h2 class="text-xl font-bold text-emerald-400 mb-4">
                My Watchlist
            </h2>

            <div id="watchlist-data" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
        </section>
    </main>
    <footer class="text-center text-yellow-400 font-semibold text-sm py-6">
        Market-Trader - Cryptocurrency Market Dashbord
    </footer>

    <script src="app.js"></script>
</body>

</html>

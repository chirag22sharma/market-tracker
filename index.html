<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Tracker</title>
</head>
<body>
    <header>
        <h1>Market Tracker</h1>
        <p>Track cryptocurrency prices in one place.</p>
    </header>
    <main>
        <section>
            <h2>Search Coins</h2>
            <input type="text" placeholder="Enter coin name">
            <button>Search</button>
        </section>

        <section>
            <h2>Top 20 Coins</h2>
            <p>Cryptocurrency data will appear here.</p>
        </section>
        <section>
            <h2>My Watchlist</h2>
            <p>Your saved coins will appear here.</p>
        </section>
    </main>
</body>
</html>
